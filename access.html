<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="인스타 정사각형 사진 편집기"><link rel="icon" href="assets/book-bookmark.svg"><link rel="stylesheet" href="css/access.css?v=20261001-2"><title>Square Note · bookmark</title></head><body>
<header class="topbar"><a class="brand" href="./"><i></i>Square Note</a><div><button id="reset" class="btn light">초기화</button><button id="download" class="btn dark">PNG 저장</button></div></header>
<main class="workspace"><section><div class="heading"><div><small>1080 × 1080</small><h1>피드 한 장 만들기</h1></div><span id="status">설정 자동 저장</span></div><div id="drop" class="canvas-wrap"><canvas id="canvas" width="1080" height="1080"></canvas><div id="hint" class="hint"><b>＋</b><strong>사진을 여기에 놓으세요</strong><span>또는 오른쪽에서 사진을 선택하세요</span></div></div><p class="tip">사진을 드래그해 움직이고 마우스 휠로 확대할 수 있어요.</p></section>
<aside><section class="card"><h2><em>01</em> 사진</h2><label class="upload" for="file"><strong>사진 선택</strong><small>JPG, PNG, WEBP · 최대 20MB</small></label><input id="file" type="file" accept="image/*" hidden><div class="grid"><label class="field wide"><span>배치</span><select id="fit"><option value="contain">사진 전체 보기</option><option value="cover">영역 가득 채우기</option></select></label><label class="field"><span>여백</span><output id="padding-out">96</output><input id="padding" type="range" min="0" max="260" value="96"></label><label class="field"><span>확대</span><output id="zoom-out">100%</output><input id="zoom" type="range" min="50" max="250" value="100"></label></div></section>
<section class="card"><h2><em>02</em> 글씨</h2><label class="field wide text"><span>문구</span><textarea id="text" rows="3" maxlength="120" placeholder="오늘의 한 문장을 적어보세요"></textarea></label><div class="grid"><label class="field wide"><span>글꼴</span><select id="family"><option value="Arial, sans-serif">고딕</option><option value="Georgia, serif">명조</option><option value="'Courier New', monospace">타자기</option></select></label><label class="field"><span>크기</span><output id="size-out">52</output><input id="size" type="range" min="24" max="110" value="52"></label><label class="field"><span>위치</span><output id="y-out">86%</output><input id="text-y" type="range" min="8" max="94" value="86"></label></div><div class="align"><button data-align="left">왼쪽</button><button class="on" data-align="center">가운데</button><button data-align="right">오른쪽</button></div><div class="colors"><label>글자색 <input id="text-color" type="color" value="#151515"></label><label>배경색 <input id="bg" type="color" value="#ffffff"></label></div></section><button id="mobile-download" class="btn dark mobile">PNG로 저장하기</button><a class="back" href="./">bookmark로 돌아가기</a></aside></main><script src="js/access-editor.js?v=20261001-1"></script></body></html>
