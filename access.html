<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="인스타 정사각형 사진 편집기"><link rel="icon" href="assets/book-bookmark.svg"><link rel="stylesheet" href="css/access.css?v=20261003-2"><title>Square Note · bookmark</title></head>
<body>
<header class="topbar"><a class="brand" href="./"><i></i>Square Note</a><div><button id="reset" class="btn light">초기화</button><button id="download" class="btn dark">PNG 저장</button></div></header>
<main class="workspace">
  <aside class="controls controls-left">
    <section class="card"><h2><em>01</em> 배경</h2><label class="background-picker"><span>배경색</span><input id="bg" type="color" value="#ffffff"></label></section>
    <section class="card"><h2><em>02</em> 사진</h2><label class="upload" for="file"><strong>사진 추가</strong><small>여러 장 선택 가능 · 각 20MB 이하</small></label><input id="file" type="file" accept="image/*" multiple hidden>
      <div class="grid"><label class="field wide"><span>선택 사진 배치</span><select id="fit"><option value="contain">사진 전체 보기</option><option value="cover">영역 가득 채우기</option></select></label></div>
      <div class="margin-control"><div class="margin-head"><span>양옆 여백</span><label><input id="padding-x-number" type="number" min="0" max="360" step="1" value="96"> px</label></div><input id="padding-x" type="range" min="0" max="360" value="96"></div>
      <div class="margin-control"><div class="margin-head"><span>위아래 여백</span><label><input id="padding-y-number" type="number" min="0" max="360" step="1" value="96"> px</label></div><input id="padding-y" type="range" min="0" max="360" value="96"></div>
      <button id="link-margins" class="link-margins" type="button" aria-pressed="false">상하·좌우 여백 연결</button>
      <div class="margin-presets" aria-label="여백 빠른 설정"><button type="button" data-margin="0">0</button><button type="button" data-margin="48">48</button><button type="button" data-margin="96">96</button><button type="button" data-margin="120">120</button></div>
    </section>
  </aside>

  <section class="preview"><div class="heading"><small>1080 × 1080</small><span id="status">설정 자동 저장</span></div><div id="drop" class="canvas-wrap"><canvas id="canvas" width="1080" height="1080"></canvas><div id="hint" class="hint"><b>＋</b><strong>사진을 여기에 놓으세요</strong><span>또는 왼쪽에서 사진을 선택하세요</span></div></div><p class="tip">사진을 드래그해 움직이고 마우스 휠로 확대·축소할 수 있어요.</p></section>

  <aside class="controls controls-right">
    <section class="card"><h2><em>03</em> 사진 레이어</h2><div id="layers" class="layers"><p class="layers-empty">사진을 추가하면 여기에 쌓여요.</p></div><p class="layer-help">드래그해 순서를 바꾸고, 방향키로 위치를 미세 조정하세요.</p><div class="photo-options"><label><input id="crop" type="checkbox" checked><span><strong>프레임에 맞춰 자르기</strong><small>점선 밖 사진은 저장되지 않아요</small></span></label><label><input id="guides" type="checkbox" checked><span><strong>여백 점선 보기</strong><small>점선은 PNG에 포함되지 않아요</small></span></label></div><div class="photo-actions"><button id="center" type="button">선택 사진 가운데</button><button id="lock" type="button" aria-pressed="false">선택 사진 고정</button></div></section>
    <section class="card"><h2><em>04</em> 글씨</h2><label class="field wide text"><span>문구</span><textarea id="text" rows="3" maxlength="120" placeholder="오늘의 한 문장을 적어보세요"></textarea></label><div class="grid"><label class="field wide"><span>글꼴</span><select id="family"><option value="Arial, sans-serif">고딕</option><option value="Georgia, serif">명조</option><option value="'Courier New', monospace">타자기</option></select></label><label class="field"><span>크기</span><output id="size-out">52</output><input id="size" type="range" min="24" max="110" value="52"></label><label class="field"><span>위치</span><output id="y-out">86%</output><input id="text-y" type="range" min="8" max="94" value="86"></label></div><div class="align"><button data-align="left">왼쪽</button><button class="on" data-align="center">가운데</button><button data-align="right">오른쪽</button></div><div class="colors"><label>글자색 <input id="text-color" type="color" value="#151515"></label></div></section>
    <button id="mobile-download" class="btn dark mobile">PNG로 저장하기</button><a class="back" href="./">bookmark로 돌아가기</a>
  </aside>
</main>
<script src="js/access-editor.js?v=20261003-2"></script>
</body></html>
